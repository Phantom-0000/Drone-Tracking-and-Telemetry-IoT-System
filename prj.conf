CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SERIAL=y
# GPS RX (USART1) and the VCOM TX (LPUART1) are interrupt driven, so no
# thread busy-waits on a UART and the idle thread can enter WFI.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ADC=y
CONFIG_PRINTK=y
CONFIG_BOOT_BANNER=n
# Disabled so an assertion message can never print on the VCOM stream and
# corrupt SIMU output (GR5 / SM6). Set to y only during local debugging.
CONFIG_ASSERT=n
# Keep comfortable headroom with hardware MPU stack guards enabled.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
# Tracker thresholds are defined only in Kconfig (single source of truth).
